# Copy to config.toml to override. Without it, the defaults apply (UTC, 3 sessions, built-in sport mapping).

# IANA time zone: sets "today" and the Monday-to-Sunday week boundaries.
timezone = "UTC"

# Strength sessions per week you aim for. Shown against the actual count.
gym_target = 3

# Optional. Map a Garmin activity type to a category, or add a type the defaults don't know.
# Categories: running, cycling, swimming, strength, hiking_walking, winter_sports, team_sports,
# racket_sports, other. See docs/sports.md for the built-in mapping.
[sports]
# yoga = "strength"
# mountain_biking = "cycling"
